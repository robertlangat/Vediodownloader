name: Build, test and release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      APK_NAME: SocialVideoDownloader-${{ github.ref_name }}.apk
      # Set the repository variable BACKEND_URL (Settings > Secrets and variables > Actions > Variables)
      # to bake your deployed backend into the APK.
      BACKEND_URL: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Backend tests
        run: |
          cd backend
          node --test test/*.test.js 2>&1 | tee ../backend-tests.txt
          exit ${PIPESTATUS[0]}

      - name: Live TikTok oEmbed check (informational)
        continue-on-error: true
        run: node backend/scripts/live-check.mjs | tee live-checks.txt

      - name: Unit tests and build debug APK
        run: |
          set +e
          echo "::add-matcher::.github/kotlin-problem-matcher.json"
          ./gradlew --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest -PbackendUrl="${BACKEND_URL}" 2>&1 | tee build-log.txt
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then grep -A3 "What went wrong" build-log.txt | head -12 | while IFS= read -r l; do [ -n "$l" ] && echo "::error title=Gradle::$l"; done; fi
          exit $status

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          ls -la dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator tests (API 30)
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-tests.sh

      - name: Test report
        if: always()
        run: |
          set +e
          python3 .github/scripts/test_report.py test-report.md || true
          if [ -f svd-test-logcat.txt ]; then { echo; echo '## Emulator log (SVD-TEST)'; echo '```'; tail -n 60 svd-test-logcat.txt; echo '```'; } >> test-report.md; fi
          cat test-report.md >> "$GITHUB_STEP_SUMMARY"
          grep -E "\| PASS \|" test-report.md | sed -E 's/^\| `([^`]+)`.*/\1/' | tr '\n' ' ' | sed 's/^/::notice title=Passed tests::/'; echo
          grep -E "FAIL" test-report.md | head -10 | while IFS= read -r l; do echo "::error title=Test failure::$l"; done
          echo "::notice title=Result::$(grep 'Overall' test-report.md | tr -d '*')"
          if [ -f emulator-failed ]; then grep -E "FAILED|Exception|Error:" emulator-log.txt | head -8 | while IFS= read -r l; do echo "::error title=Emulator::$l"; done; fi
          (cd screenshots 2>/dev/null && find . -name '*.png' | head -20 | xargs -r zip -j ../test-screenshots.zip) || true
          tail -n 200 build-log.txt > build-log-tail.txt 2>/dev/null || true
          tail -n 200 emulator-log.txt > emulator-log-tail.txt 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-and-reports
          path: |
            dist/*.apk
            test-report.md
            test-screenshots.zip
            build-log-tail.txt
            emulator-log-tail.txt

      - name: Publish pre-release with APK
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="Test build of Social Video Downloader (debug APK, Android 10+). See README for backend setup and platform limits. Automated test report attached (test-report.md)."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Social Video Downloader $TAG" --notes "$NOTES" --verify-tag
          FILES="dist/${APK_NAME} test-report.md"
          [ -f test-screenshots.zip ] && FILES="$FILES test-screenshots.zip"
          gh release upload "$TAG" $FILES --clobber

      - name: Publish tested APK to the apk-builds branch (direct download link)
        if: always() && env.IS_TAG != 'true' && github.ref == 'refs/heads/main'
        run: |
          set -e
          if [ -f emulator-failed ] || [ ! -f "dist/${APK_NAME}" ]; then echo "Tests failed or no APK; not publishing."; exit 0; fi
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          OUT="SocialVideoDownloader-v${VERSION}.apk"
          mkdir -p /tmp/apkpub && cp "dist/${APK_NAME}" "/tmp/apkpub/${OUT}"
          cp test-report.md /tmp/apkpub/ 2>/dev/null || true
          printf '# Latest tested APK\n\nBuilt from %s.\n\nDownload: [%s](https://github.com/%s/raw/apk-builds/%s)\n' "$GITHUB_SHA" "$OUT" "$GITHUB_REPOSITORY" "$OUT" > /tmp/apkpub/README.md
          cd /tmp/apkpub
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Tested APK ${VERSION} from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
          echo "::notice title=APK::https://github.com/${GITHUB_REPOSITORY}/raw/apk-builds/${OUT}"

      - name: Fail if emulator tests failed
        if: always()
        run: test ! -f emulator-failed
